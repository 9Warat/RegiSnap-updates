<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ชำระเงินสำเร็จ — RegiSnap Pro</title>
    <style>
      :root { color-scheme: light dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: grid; place-items: center;
        font-family: "Segoe UI", system-ui, sans-serif;
        background: #0e0e11; color: #e4e1e6; padding: 24px;
      }
      @media (prefers-color-scheme: light) { body { background: #f6f7fb; color: #1a1b1f; } }
      .card {
        max-width: 420px; width: 100%; text-align: center;
        border: 1px solid rgba(128,128,128,.25); border-radius: 16px;
        padding: 32px 28px; background: rgba(128,128,128,.06);
      }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 18px; border-radius: 50%;
        display: grid; place-items: center; background: #0078d4; color: #fff;
        font-size: 30px; line-height: 1;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { font-size: 14px; line-height: 1.6; opacity: .85; margin: 0 0 6px; }
      .hint { margin-top: 18px; font-size: 12px; opacity: .6; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">✓</div>
      <h1>ชำระเงินสำเร็จ</h1>
      <p>ขอบคุณที่สนับสนุน RegiSnap 🎉</p>
      <p>สิทธิ์ <strong>Pro (ตลอดชีพ)</strong> ถูกเปิดใช้งานกับบัญชีของคุณแล้ว</p>
      <p class="hint">กลับไปที่แอป RegiSnap ได้เลย — ฟีเจอร์ Pro จะปลดล็อกอัตโนมัติภายในไม่กี่วินาที (ปิด-เปิดหน้าบัญชีใหม่หากยังไม่ขึ้น)</p>
    </div>
  </body>
</html>
